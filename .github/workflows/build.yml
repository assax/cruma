# Build a všechny testy při každém push a pull requestu (plan.md N-8, úkol T-7).
# Linux runner: WPF desktop se sestaví díky EnableWindowsTargeting, integrační testy běží
# proti PostgreSQL přes Testcontainers nad Dockerem runneru.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Cruma.slnx

      - name: Build
        run: dotnet build Cruma.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Cruma.slnx --no-build --configuration Release
          --logger trx --results-directory TestResults

      # compose.yaml musí fungovat i v Dockeru (OPS-001); lokálně se ověřuje v Podmanu.
      # Heslo je jednorázové pro tento běh, ne tajný údaj (SEC-006).
      - name: Compose dev profile in Docker
        run: |
          echo "CRUMA_DEV_DB_PASSWORD=$(openssl rand -hex 16)" > deploy/.env
          docker compose -f deploy/compose.yaml --profile dev up --detach --wait
          docker compose -f deploy/compose.yaml --profile dev exec -T db-dev psql -U cruma -d cruma -tAc "select version()"
          docker compose -f deploy/compose.yaml --profile dev down --volumes

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
