# Vydání na značku verze (plan.md N-8, T-60): image serveru do GitHub Container Registry s pevnou verzí (OPS-004)
# a instalátor desktopu s aktualizačním feedem (Velopack) jako artefakt pro nahrání na server (N-6).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push server image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cruma-server:${{ steps.version.outputs.value }}"
          docker build -f deploy/server.Dockerfile --build-arg VERSION=${{ steps.version.outputs.value }} -t "$image" .
          docker push "$image"

  desktop-installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Version from tag
        id: version
        shell: pwsh
        run: '"value=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Pack desktop
        shell: pwsh
        run: ./deploy/desktop/pack.ps1 -Version ${{ steps.version.outputs.value }} -FeedUrl "${{ vars.CRUMA_DESKTOP_FEED_URL }}" -OutputDir artifacts/desktop-feed

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-feed-${{ steps.version.outputs.value }}
          path: artifacts/desktop-feed
